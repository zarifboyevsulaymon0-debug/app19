<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>DevFlow - Smart Manager</title>
    <style>
        :root {
            --bg: #0a192f;
            --card: #112240;
            --accent: #64ffda;
            --text: #ccd6f6;
            --danger: #ff4d4d;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Consolas', monospace;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .main-box {
            width: 100%;
            max-width: 800px;
        }

        .header {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            background: #020c1b;
            border: 1px solid #233554;
            padding: 12px;
            color: var(--accent);
            border-radius: 5px;
            outline: none;
        }

        button {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background: rgba(100, 255, 218, 0.1); }

        .list-container { display: grid; gap: 15px; }

        .item-card {
            background: var(--card);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

        .item-text { flex: 1; margin-right: 15px; }

        .controls { display: flex; gap: 10px; }

        .copy-btn { color: var(--accent); border-color: var(--accent); font-size: 12px; }
        .del-btn { color: var(--danger); border-color: var(--danger); font-size: 12px; }
    </style>
</head>
<body>

<div class="main-box">
    <div class="header">
        <h2 style="margin:0;">⚡ DEV_FLOW <small style="font-size: 12px; color: var(--accent);">v1.0</small></h2>
        <span id="date"></span>
    </div>

    <div class="input-group">
        <input type="text" id="mainInput" placeholder="Kod yoki vazifani kiriting...">
        <button onclick="addItem()">QO'SHISH</button>
    </div>

    <div id="list" class="list-container">
        <!-- Elementlar shu yerga tushadi -->
    </div>
</div>

<script>
    let storage = JSON.parse(localStorage.getItem('dev_flow_data')) || [];

    function addItem() {
        const input = document.getElementById('mainInput');
        if(!input.value) return;

        storage.push({
            id: Date.now(),
            text: input.value,
            time: new Date().toLocaleTimeString()
        });

        input.value = '';
        saveAndRender();
    }

    function deleteItem(id) {
        storage = storage.filter(item => item.id !== id);
        saveAndRender();
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("Nusxa olindi! ✅");
    }

    function saveAndRender() {
        localStorage.setItem('dev_flow_data', JSON.stringify(storage));
        const list = document.getElementById('list');
        list.innerHTML = '';

        storage.reverse().forEach(item => {
            list.innerHTML += `
                <div class="item-card">
                    <div class="item-text">
                        <div style="font-size:11px; color:#8892b0; margin-bottom:5px;">[${item.time}]</div>
                        <code>${item.text}</code>
                    </div>
                    <div class="controls">
                        <button class="copy-btn" onclick="copyToClipboard('${item.text}')">COPY</button>
                        <button class="del-btn" onclick="deleteItem(${item.id})">DEL</button>
                    </div>
                </div>
            `;
        });
        storage.reverse(); // Tartibni joyiga qaytarish
    }

    document.getElementById('date').innerText = new Date().toLocaleDateString();
    saveAndRender();
</script>

</body>
</html>
